<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hari Bhai Company - Login</title>

<style>

body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:linear-gradient(-45deg,#1e3c72,#2a5298,#0f2027,#203a43);
background-size:400% 400%;
animation:bgmove 8s ease infinite;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:320px;
background:#fff;
border-radius:14px;
padding:20px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
text-align:center;
animation:popup 0.3s ease;
}

.company{
font-size:16px;
font-weight:bold;
color:white;
background:#0a66c2;
padding:6px;
border-radius:6px;
margin-bottom:5px;
}

.tagline{
font-size:11px;
color:gray;
margin-bottom:15px;
}

h2{
margin:10px 0;
color:#0a66c2;
font-size:16px;
}

input{
width:100%;
padding:8px;
margin:6px 0;
border-radius:6px;
border:1px solid #ccc;
font-size:13px;
}

button{
width:100%;
padding:8px;
margin-top:8px;
background:#0a66c2;
color:white;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
font-size:13px;
}

button:hover{
background:#003366;
}

.switch{
margin-top:10px;
font-size:11px;
}

.switch span{
color:#0a66c2;
cursor:pointer;
font-weight:bold;
}

@keyframes popup{
from{transform:scale(0.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* Popup */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
}

.popup-box{
background:white;
padding:20px;
border-radius:12px;
text-align:center;
width:260px;
animation:pop 0.3s ease;
}

.popup-box p{
font-size:14px;
margin-bottom:15px;
color:#333;
}

.popup-box button{
background:#0a66c2;
color:white;
border:none;
padding:7px 20px;
border-radius:6px;
cursor:pointer;
}

@keyframes pop{
from{transform:scale(0.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<div class="container">

<div class="company">Hari Bhai Company</div>
<div class="tagline">Trusted & Professional Digital Services</div>

<h2>Login</h2>

<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="pass" placeholder="Enter Password">

<button onclick="login()">Login</button>

<button onclick="googleLogin()" style="background:#db4437;margin-top:8px;">
Login with Google
</button>

<button onclick="resetPassword()" style="background:#ff9800;margin-top:8px;">
Forgot Password
</button>

<div class="switch">
Don't have account? <span onclick="window.location.href='join.html'">Register</span>
</div>

</div>


<!-- Popup -->

<div id="popup" class="popup">
<div class="popup-box">
<p id="popupText">Message</p>
<button onclick="closePopup()">OK</button>
</div>
</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
GoogleAuthProvider,
signInWithPopup,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyBG0LYrIEuV_eYK8rZvweoQASTBF_gfDfA",
authDomain: "ff-tournament-915ed.firebaseapp.com",
projectId: "ff-tournament-915ed",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();



function showPopup(msg){
document.getElementById("popupText").innerText = msg;
document.getElementById("popup").style.display = "flex";
}

window.closePopup = function(){
document.getElementById("popup").style.display = "none";
}



window.login = async function(){

const email = document.getElementById('email').value.trim().toLowerCase();
const pass = document.getElementById('pass').value.trim();

if(!email || !pass){
showPopup("⚠️ Please fill all fields");
return;
}

try{

await signInWithEmailAndPassword(auth,email,pass);

showPopup("✅ Login Successful");

setTimeout(()=>{
window.location.href="index.html";
},1500);

}catch(err){

showPopup(err.message);

}

}



window.googleLogin = async function(){

try{

const result = await signInWithPopup(auth, provider);

const user = result.user;

const userRef = doc(db,"users",user.uid);

const docSnap = await getDoc(userRef);

if(!docSnap.exists()){

await setDoc(userRef,{
username: "HB" + Math.floor(100000 + Math.random()*900000),
email: user.email,
balance:0,
blocked:false,
createdAt: new Date()
});

}

showPopup("✅ Login Successful");

setTimeout(()=>{
window.location.href="index.html";
},1500);

}catch(err){

showPopup(err.message);

}

}



window.resetPassword = async function(){

const email = document.getElementById('email').value.trim();

if(!email){

showPopup("⚠️ Enter your email first");

return;

}

try{

await sendPasswordResetEmail(auth,email);

showPopup("📧 Password reset link sent to your email");

}catch(err){

showPopup(err.message);

}

}

</script>

</body>
</html>
