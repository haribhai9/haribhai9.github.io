<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{text-align:center}

.card{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

input{
width:100%;
padding:8px;
margin-top:5px;
border:none;
border-radius:6px;
}

button{
margin-top:6px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.green{background:#22c55e;color:white}
.red{background:#ef4444;color:white}
.blue{background:#3b82f6;color:white}

.user-box{
background:#111827;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

hr{border:1px solid #334155}

</style>
</head>

<body>

<script>
const adminPassword="1122334455";
let pass=prompt("Enter Admin Password");

if(pass!==adminPassword){
document.body.innerHTML="<h1>Access Denied ❌</h1>";
throw new Error("Blocked");
}
</script>

<h1>🔥 Admin Dashboard</h1>

<div class="card">

<h3>Room Control</h3>

<label>Room1 ID</label>
<input id="roomID_room1">

<label>Room1 PASS</label>
<input id="roomPASS_room1">

<button class="green" onclick="saveRoom('room1')">Save</button>
<button class="red" onclick="resetRoom('room1')">Reset</button>
<button class="blue" onclick="setRoomOver('room1')">Match Over</button>

<hr>

<label>Room2 ID</label>
<input id="roomID_room2">

<label>Room2 PASS</label>
<input id="roomPASS_room2">

<button class="green" onclick="saveRoom('room2')">Save</button>
<button class="red" onclick="resetRoom('room2')">Reset</button>
<button class="blue" onclick="setRoomOver('room2')">Match Over</button>

<hr>

<label>Room3 ID</label>
<input id="roomID_room3">

<label>Room3 PASS</label>
<input id="roomPASS_room3">

<button class="green" onclick="saveRoom('room3')">Save</button>
<button class="red" onclick="resetRoom('room3')">Reset</button>
<button class="blue" onclick="setRoomOver('room3')">Match Over</button>

<hr>

<label>Room4 ID</label>
<input id="roomID_room4">

<label>Room4 PASS</label>
<input id="roomPASS_room4">

<button class="green" onclick="saveRoom('room4')">Save</button>
<button class="red" onclick="resetRoom('room4')">Reset</button>
<button class="blue" onclick="setRoomOver('room4')">Match Over</button>

</div>

<div class="card">

<h3>Match Time</h3>

<input id="matchTime1" placeholder="Match1 Time">
<button class="green" onclick="updateMatchTime('match1')">Update</button>

<hr>

<input id="matchTime2" placeholder="Match2 Time">
<button class="green" onclick="updateMatchTime('match2')">Update</button>

<hr>

<input id="matchTime3" placeholder="Match3 Time">
<button class="green" onclick="updateMatchTime('match3')">Update</button>

<hr>

<input id="matchTime4" placeholder="Match4 Time">
<button class="green" onclick="updateMatchTime('match4')">Update</button>

</div>

<div class="card">

<h3>Entry & Win Control</h3>

<label>Room1 Entry</label>
<input id="entry1" type="number">

<label>Room1 Win</label>
<input id="win1" type="number">

<button class="green" onclick="updatePrize('room1')">Update</button>

<hr>

<label>Room2 Entry</label>
<input id="entry2" type="number">

<label>Room2 Win</label>
<input id="win2" type="number">

<button class="green" onclick="updatePrize('room2')">Update</button>

<hr>

<label>Room3 Entry</label>
<input id="entry3" type="number">

<label>Room3 Win</label>
<input id="win3" type="number">

<button class="green" onclick="updatePrize('room3')">Update</button>

<hr>

<label>Room4 Entry</label>
<input id="entry4" type="number">

<label>Room4 Win</label>
<input id="win4" type="number">

<button class="green" onclick="updatePrize('room4')">Update</button>

</div>

<div class="card">
<h3>Players Registered</h3>
<input id="searchUser" placeholder="Search Username">
<button onclick="searchUser()">Search</button>
<div id="users"></div>
</div>

<div class="card">
<h3>Deposits</h3>
<div id="deposits"></div>
</div>

<div class="card">
<h3>Withdrawals</h3>
<div id="withdrawals"></div>
</div>
<div class="card">
<h3>All Joined Users</h3>
<div id="allUsers"></div>
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
collection,
doc,
onSnapshot,
updateDoc,
setDoc,
getDoc,
getDocs,
deleteDoc,
increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBG0LYrIEuV_eYK8rZvweoQASTBF_gfDfA",
authDomain:"ff-tournament-915ed.firebaseapp.com",
projectId:"ff-tournament-915ed"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* SAVE ROOM */

window.saveRoom=async function(id){

let roomID=document.getElementById("roomID_"+id).value;
let roomPASS=document.getElementById("roomPASS_"+id).value;

await setDoc(doc(db,"rooms",id),{
roomID,
roomPASS,
slots:0,
over:false
},{merge:true});

alert("Room Saved");

}


/* RESET ROOM */

window.resetRoom=async function(roomId){

await setDoc(doc(db,"rooms",roomId),{
roomID:"",
roomPASS:"",
slots:0,
over:false
});

const usersSnap=await getDocs(collection(db,"users"));

for(const u of usersSnap.docs){

if(u.data().joinedRoom===roomId){

await updateDoc(doc(db,"users",u.id),{
joinedRoom:"",
gameName:""
});

}

}

alert("Room Reset Done");

}


/* MATCH OVER */

window.setRoomOver=async function(room){

await updateDoc(doc(db,"rooms",room),{
over:true
});

alert("Room Marked Over");

}


/* MATCH TIME */

window.updateMatchTime=async function(match){

let number=match.replace("match","");
let time=document.getElementById("matchTime"+number).value;

await setDoc(doc(db,"settings",match),{time});

alert("Time Updated");

}


/* ENTRY WIN */

window.updatePrize=async function(room){

let number=room.replace("room","");

let entry=document.getElementById("entry"+number).value;
let win=document.getElementById("win"+number).value;

await setDoc(doc(db,"settings",room+"Prize"),{
entry:Number(entry),
win:Number(win)
});

alert("Prize Updated");

}


/* PLAYERS (JOINED ONLY) */

const usersDiv=document.getElementById("users");

onSnapshot(collection(db,"users"),async(snapshot)=>{

usersDiv.innerHTML="";

for(const docSnap of snapshot.docs){

const data=docSnap.data();
const uid=docSnap.id;

if(!data.joinedRoom) continue;

let room=data.joinedRoom;
let gameName=data.gameName||"-";

let deposit=data.balance||0;
let winning=data.winningBalance||0;
let total=deposit+winning;

let entry="...";

const prizeSnap=await getDoc(doc(db,"settings",room+"Prize"));

if(prizeSnap.exists()) entry=prizeSnap.data().entry;

usersDiv.innerHTML+=`

<div class="user-box">

<b>UID:</b> ${uid}<br>
<b>Username:</b> ${data.username||"-"}<br>
<b>Game Name:</b> ${gameName}<br>
<b>Room:</b> ${room}<br>
<b>Entry Fee:</b> ₹${entry}<br>

<b>Deposit:</b> ₹${deposit}<br>
<b>Winning:</b> ₹${winning}<br>
<b>Total Balance:</b> ₹${total}

<input type="number" id="amt_${uid}" placeholder="Amount">

<button class="green" onclick="addBalance('${uid}')">Add</button>
<button class="red" onclick="cutBalance('${uid}')">Cut</button>

<button class="blue" onclick="blockUser('${uid}')">Block</button>
<button class="blue" onclick="unblockUser('${uid}')">Unblock</button>

</div>

<hr>
`;

}

});


/* ADD BALANCE (WINNING) */

window.addBalance=async function(uid){

let amt=parseInt(document.getElementById("amt_"+uid).value);
if(!amt) return;

await updateDoc(doc(db,"users",uid),{
winningBalance:increment(amt)
});

alert("Winning Balance Added");

}


/* CUT BALANCE */

window.cutBalance=async function(uid){

let amt=parseInt(document.getElementById("amt_"+uid).value);
if(!amt) return;

const ref=doc(db,"users",uid);
const snap=await getDoc(ref);
let data=snap.data();

let deposit=data.balance||0;
let winning=data.winningBalance||0;

let newDeposit=deposit;
let newWinning=winning;

if(deposit>=amt){
newDeposit=deposit-amt;
}else{
let remain=amt-deposit;
newDeposit=0;
newWinning=winning-remain;
}

await updateDoc(ref,{
balance:newDeposit,
winningBalance:newWinning
});

alert("Balance Cut");

}


/* BLOCK */

window.blockUser=async(uid)=>{
await updateDoc(doc(db,"users",uid),{blocked:true})
alert("User Blocked")
}

window.unblockUser=async(uid)=>{
await updateDoc(doc(db,"users",uid),{blocked:false})
alert("User Unblocked")
}


/* DEPOSITS */

onSnapshot(collection(db,"deposits"), async (snapshot)=>{

const div=document.getElementById("deposits");
div.innerHTML="";

snapshot.forEach(async (d)=>{

let data=d.data();

if(!data.status || data.status.toLowerCase()==="pending"){

let username=data.username;

if(!username && data.uid){
const u=await getDoc(doc(db,"users",data.uid));
if(u.exists()) username=u.data().username;
}

div.innerHTML+=`

<div class="user-box">

<b>User:</b> ${username||"Unknown"}<br>
<b>Amount:</b> ₹${data.amount}<br>
<b>UTR:</b> ${data.utr || "-"}

<button class="green" onclick="approveDeposit('${d.id}','${data.uid}',${data.amount})">Approve</button>
<button class="red" onclick="rejectDeposit('${d.id}')">Reject</button>

</div>

`;

}

});

});


window.approveDeposit=async(id,uid,amt)=>{

await updateDoc(doc(db,"users",uid),{
balance:increment(amt)
})

await updateDoc(doc(db,"deposits",id),{
status:"Approved"
})

alert("Deposit Approved")

}

window.rejectDeposit=async(id)=>{

await updateDoc(doc(db,"deposits",id),{
status:"Rejected"
})

alert("Deposit Rejected")

}


/* WITHDRAWALS */

onSnapshot(collection(db,"withdrawals"), async (snapshot)=>{

const div=document.getElementById("withdrawals");
div.innerHTML="";

snapshot.forEach(async (d)=>{

let data=d.data();

if(!data.status || data.status.toLowerCase()==="pending"){

let username=data.username || "Unknown"

if(!username && data.uid){
const u=await getDoc(doc(db,"users",data.uid));
if(u.exists()) username=u.data().username;
}

div.innerHTML+=`

<div class="user-box">

<b>User:</b> ${username||"Unknown"}<br>
<b>Amount:</b> ₹${data.amount}<br>
<b>Method:</b> ${data.method || "-"}<br>
<b>Details:</b> ${data.details || "-"}

<button class="green" onclick="approveWithdraw('${d.id}')">Approve</button>
<button class="red" onclick="rejectWithdraw('${d.id}')">Reject</button>

</div>

`;

}

});

});


window.approveWithdraw=async(id)=>{

await updateDoc(doc(db,"withdrawals",id),{
status:"Approved"
})

alert("Withdrawal Approved")

}

window.rejectWithdraw=async(id)=>{

await updateDoc(doc(db,"withdrawals",id),{
status:"Rejected"
})

alert("Withdrawal Rejected")

}


/* SEARCH USER */

window.searchUser = async function(){

let name = document.getElementById("searchUser").value.toLowerCase().trim()

const snap = await getDocs(collection(db,"users"))

usersDiv.innerHTML=""

snap.forEach(docSnap=>{

const data = docSnap.data()
const uid = docSnap.id

if(!data.username || data.username.trim()==="") return

if(data.username.toLowerCase().includes(name)){

let deposit = data.balance || 0
let winning = data.winningBalance || 0
let total = deposit + winning

let game = data.gameName ? data.gameName : "-"
let room = data.joinedRoom ? data.joinedRoom : ""

usersDiv.innerHTML += `

<div class="user-box">

<b>UID:</b> ${uid}<br>
<b>Username:</b> ${data.username}<br>
<b>Game Name:</b> ${game}<br>

${room ? `<b>Room:</b> ${room}<br>` : ""}

<b>Deposit:</b> ₹${deposit}<br>
<b>Winning:</b> ₹${winning}<br>
<b>Total:</b> ₹${total}

<input type="number" id="amt_${uid}" placeholder="Amount">

<button class="green" onclick="addBalance('${uid}')">Add</button>
<button class="red" onclick="cutBalance('${uid}')">Cut</button>

<button class="blue" onclick="blockUser('${uid}')">Block</button>
<button class="blue" onclick="unblockUser('${uid}')">Unblock</button>

</div>

<hr>

`

}

})

}

/* ALL JOINED USERS */

const allUsersDiv=document.getElementById("allUsers")

onSnapshot(collection(db,"users"),(snapshot)=>{

allUsersDiv.innerHTML=""

snapshot.forEach(docSnap=>{

const data=docSnap.data()
const uid=docSnap.id

if(!data.joinedRoom || data.joinedRoom==="") return

let deposit=data.balance||0
let winning=data.winningBalance||0
let total=deposit+winning

allUsersDiv.innerHTML+=`

<div class="user-box">

<b>UID:</b> ${uid}<br>
<b>Username:</b> ${data.username}<br>
<b>Game Name:</b> ${data.gameName || "-"}<br>
<b>Room:</b> ${data.joinedRoom}<br>

<b>Deposit:</b> ₹${deposit}<br>
<b>Winning:</b> ₹${winning}<br>
<b>Total:</b> ₹${total}

<input type="number" id="amt_${uid}" placeholder="Amount">

<button class="green" onclick="addBalance('${uid}')">Add</button>
<button class="red" onclick="cutBalance('${uid}')">Cut</button>

<button class="blue" onclick="blockUser('${uid}')">Block</button>
<button class="blue" onclick="unblockUser('${uid}')">Unblock</button>

</div>

<hr>

`

})

})
</script>

</body>
</html>
