<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

h1{text-align:center}

.card{
background:#1e293b;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

input{
width:100%;
padding:8px;
margin-top:5px;
border:none;
border-radius:6px;
}

button{
margin-top:6px;
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.green{background:#22c55e;color:white}
.red{background:#ef4444;color:white}
.blue{background:#3b82f6;color:white}

.user-box{
background:#111827;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

hr{border:1px solid #334155}

</style>
</head>

<body>

<script>

const adminPassword="998877";

let pass=prompt("Enter Admin Password");

if(pass!==adminPassword){

document.body.innerHTML="<h1>Access Denied ❌</h1>";
throw new Error("Blocked");

}

</script>

<h1>🔥 Admin Dashboard</h1>

<!-- ROOM CONTROL -->

<div class="card">

<h3>Room Control</h3>

<label>Room1 ID</label>
<input id="roomID_room1">

<label>Room1 PASS</label>
<input id="roomPASS_room1">

<button class="green" onclick="saveRoom('room1')">Save</button>
<button class="red" onclick="resetRoom('room1')">Reset</button>

<hr>

<label>Room2 ID</label>
<input id="roomID_room2">

<label>Room2 PASS</label>
<input id="roomPASS_room2">

<button class="green" onclick="saveRoom('room2')">Save</button>
<button class="red" onclick="resetRoom('room2')">Reset</button>

<hr>

<label>Room3 ID</label>
<input id="roomID_room3">

<label>Room3 PASS</label>
<input id="roomPASS_room3">

<button class="green" onclick="saveRoom('room3')">Save</button>
<button class="red" onclick="resetRoom('room3')">Reset</button>

<hr>

<label>Room4 ID</label>
<input id="roomID_room4">

<label>Room4 PASS</label>
<input id="roomPASS_room4">

<button class="green" onclick="saveRoom('room4')">Save</button>
<button class="red" onclick="resetRoom('room4')">Reset</button>

</div>


<!-- MATCH TIME -->

<div class="card">

<h3>Match Time</h3>

<input id="matchTime1" placeholder="Match1 Time">
<button class="green" onclick="updateMatchTime('match1')">Update</button>

<hr>

<input id="matchTime2" placeholder="Match2 Time">
<button class="green" onclick="updateMatchTime('match2')">Update</button>

<hr>

<input id="matchTime3" placeholder="Match3 Time">
<button class="green" onclick="updateMatchTime('match3')">Update</button>

<hr>

<input id="matchTime4" placeholder="Match4 Time">
<button class="green" onclick="updateMatchTime('match4')">Update</button>

</div>


<!-- ENTRY WIN CONTROL -->

<div class="card">

<h3>Entry & Win Control</h3>

<label>Room1 Entry</label>
<input id="entry1" type="number">

<label>Room1 Win</label>
<input id="win1" type="number">

<button class="green" onclick="updatePrize('room1')">Update</button>

<hr>

<label>Room2 Entry</label>
<input id="entry2" type="number">

<label>Room2 Win</label>
<input id="win2" type="number">

<button class="green" onclick="updatePrize('room2')">Update</button>

<hr>

<label>Room3 Entry</label>
<input id="entry3" type="number">

<label>Room3 Win</label>
<input id="win3" type="number">

<button class="green" onclick="updatePrize('room3')">Update</button>

<hr>

<label>Room4 Entry</label>
<input id="entry4" type="number">

<label>Room4 Win</label>
<input id="win4" type="number">

<button class="green" onclick="updatePrize('room4')">Update</button>

</div>


<!-- USERS -->

<div class="card">

<h3>Players</h3>

<input id="searchUser" placeholder="Search Username">
<button onclick="searchUser()">Search</button>

<div id="users"></div>

</div>


<!-- DEPOSITS -->

<div class="card">

<h3>Deposits</h3>

<div id="deposits"></div>

</div>


<!-- WITHDRAWALS -->

<div class="card">

<h3>Withdrawals</h3>

<div id="withdrawals"></div>

</div>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
collection,
doc,
onSnapshot,
updateDoc,
setDoc,
getDoc,
getDocs,
increment,
query,
where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyBG0LYrIEuV_eYK8rZvweoQASTBF_gfDfA",
authDomain:"ff-tournament-915ed.firebaseapp.com",
projectId:"ff-tournament-915ed"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

console.log("Admin Connected");



/* ROOM SAVE */

window.saveRoom=async function(id){

let roomID=document.getElementById("roomID_"+id).value;
let roomPASS=document.getElementById("roomPASS_"+id).value;

await setDoc(doc(db,"rooms",id),{

roomID:roomID,
roomPASS:roomPASS,
slots:0

},{merge:true});

alert("Room Saved");

}



/* RESET ROOM */

window.resetRoom=async function(roomId){

await setDoc(doc(db,"rooms",roomId),{

roomID:"",
roomPASS:"",
slots:0

});

const usersSnap=await getDocs(collection(db,"users"));

for(const u of usersSnap.docs){

if(u.data().joinedRoom===roomId){

await updateDoc(doc(db,"users",u.id),{

joinedRoom:"",
gameName:""

});

}

}

alert("Room Reset Done");

}



/* MATCH TIME */

window.updateMatchTime=async function(match){

let number=match.replace("match","");
let time=document.getElementById("matchTime"+number).value;

await setDoc(doc(db,"settings",match),{

time:time

});

alert("Time Updated");

}



/* ENTRY WIN */

window.updatePrize=async function(room){

let number=room.replace("room","");

let entry=document.getElementById("entry"+number).value;
let win=document.getElementById("win"+number).value;

await setDoc(doc(db,"settings",room+"Prize"),{

entry:Number(entry),
win:Number(win)

});

alert("Prize Updated");

}



/* USERS JOINED */

const usersDiv=document.getElementById("users");

const joinedUsersQuery=query(

collection(db,"users"),
where("joinedRoom","!=","")

);

onSnapshot(joinedUsersQuery,(snapshot)=>{

usersDiv.innerHTML="";

snapshot.forEach((docSnap)=>{

const data=docSnap.data();
const uid=docSnap.id;

usersDiv.innerHTML+=`

<div class="user-box">

<b>${data.username}</b><br>

Deposit: ₹${data.balance||0}<br>
Winning: ₹${data.winningBalance||0}<br>
Room: ${data.joinedRoom}

<input type="number" id="amt_${uid}" placeholder="Amount">

<button class="green" onclick="addBalance('${uid}')">Add</button>
<button class="red" onclick="cutBalance('${uid}')">Cut</button>

</div>

<hr>

`;

});

});



/* SEARCH USER */

window.searchUser=async function(){

let name=document.getElementById("searchUser").value;

const q=query(
collection(db,"users"),
where("username","==",name)
);

const snap=await getDocs(q);

usersDiv.innerHTML="";

snap.forEach((docSnap)=>{

const data=docSnap.data();
const uid=docSnap.id;

usersDiv.innerHTML+=`

<div class="user-box">

<b>${data.username}</b><br>

Deposit: ₹${data.balance||0}<br>
Winning: ₹${data.winningBalance||0}

<input type="number" id="amt_${uid}" placeholder="Amount">

<button onclick="addBalance('${uid}')">Add</button>
<button onclick="cutBalance('${uid}')">Cut</button>

</div>

`;

});

}



/* BALANCE CONTROL */

window.addBalance=async function(uid){

let amt=parseInt(document.getElementById("amt_"+uid).value);

if(!amt) return;

await updateDoc(doc(db,"users",uid),{

winningBalance:increment(amt)

});

alert("Added");

}

window.cutBalance=async function(uid){

let amt=parseInt(document.getElementById("amt_"+uid).value);

if(!amt) return;

await updateDoc(doc(db,"users",uid),{

balance:increment(-amt)

});

}



/* DEPOSITS */

const depositDiv=document.getElementById("deposits");

onSnapshot(query(collection(db,"deposits"),where("status","==","pending")),(snapshot)=>{

depositDiv.innerHTML="";

snapshot.forEach((docSnap)=>{

const d=docSnap.data();
const id=docSnap.id;

depositDiv.innerHTML+=`

<div class="user-box">

User: ${d.username||d.uid}<br>
Amount: ₹${d.amount}<br>
UTR: ${d.utr}

<button class="green" onclick="approveDeposit('${id}','${d.uid}',${d.amount})">Approve</button>

<button class="red" onclick="rejectDeposit('${id}')">Reject</button>

</div>

<hr>

`;

});

});


window.approveDeposit=async function(id,uid,amount){

await updateDoc(doc(db,"users",uid),{

balance:increment(amount)

});

await updateDoc(doc(db,"deposits",id),{

status:"approved"

});

alert("Deposit Approved");

}

window.rejectDeposit=async function(id){

await updateDoc(doc(db,"deposits",id),{

status:"rejected"

});

}



/* WITHDRAW */

const withdrawDiv=document.getElementById("withdrawals");

onSnapshot(query(collection(db,"withdrawals"),where("status","==","pending")),(snapshot)=>{

withdrawDiv.innerHTML="";

snapshot.forEach((docSnap)=>{

const w=docSnap.data();
const id=docSnap.id;

withdrawDiv.innerHTML+=`

<div class="user-box">

User: ${w.username||w.uid}<br>
Amount: ₹${w.amount}

<button class="green" onclick="approveWithdraw('${id}')">Approve</button>

<button class="red" onclick="rejectWithdraw('${id}','${w.uid}',${w.amount})">Reject</button>

</div>

<hr>

`;

});

});


window.approveWithdraw=async function(id){

await updateDoc(doc(db,"withdrawals",id),{

status:"approved"

});

}

window.rejectWithdraw=async function(id,uid,amount){

await updateDoc(doc(db,"users",uid),{

winningBalance:increment(amount)

});

await updateDoc(doc(db,"withdrawals",id),{

status:"rejected"

});

}

</script>

</body>
</html>
