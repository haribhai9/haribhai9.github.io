<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Admin Login • Hari Battle Arena</title>

<style>
:root{
 --bg:#05070d;--panel:rgba(15,23,42,.78);--border:rgba(255,255,255,.10);
 --text:#f8fafc;--muted:#94a3b8;--cyan:#22d3ee;--blue:#2563eb;
 --red:#f87171;--green:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif}
body{
 min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);
 background:
 radial-gradient(circle at 15% 15%,rgba(34,211,238,.18),transparent 28%),
 radial-gradient(circle at 90% 85%,rgba(37,99,235,.20),transparent 30%),
 linear-gradient(135deg,#05070d,#0b1020 55%,#05070d);
 overflow:hidden;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
 background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
 background-size:38px 38px;
}
.orb{position:fixed;border-radius:50%;filter:blur(45px);pointer-events:none}
.orb.one{width:180px;height:180px;background:rgba(34,211,238,.13);top:8%;left:-70px}
.orb.two{width:220px;height:220px;background:rgba(59,130,246,.12);right:-90px;bottom:5%}

.card{
 width:min(390px,100%);position:relative;padding:28px 24px;
 border:1px solid var(--border);border-radius:28px;
 background:var(--panel);backdrop-filter:blur(22px);
 box-shadow:0 30px 90px rgba(0,0,0,.50);
}
.badge{
 width:68px;height:68px;margin:0 auto 15px;display:grid;place-items:center;
 border-radius:21px;font-size:29px;
 background:linear-gradient(135deg,var(--cyan),var(--blue));
 box-shadow:0 12px 35px rgba(34,211,238,.20);
}
h1{text-align:center;font-size:23px;margin:0}
.subtitle{text-align:center;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin:6px 0 22px}
.secure{
 display:flex;justify-content:center;gap:6px;align-items:center;margin-bottom:18px;
 color:#86efac;background:rgba(34,197,94,.07);
 border:1px solid rgba(34,197,94,.18);border-radius:999px;padding:7px;
 font-size:8px;font-weight:800;
}
label{display:block;color:#cbd5e1;font-size:9px;font-weight:700;margin:12px 0 6px}
.input-wrap{position:relative}
input{
 width:100%;height:46px;padding:0 13px;border-radius:12px;
 border:1px solid var(--border);outline:none;background:rgba(2,6,23,.75);
 color:white;font-size:12px;
}
input:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 4px rgba(34,211,238,.07)}
.password-toggle{
 position:absolute;right:7px;top:7px;width:32px;height:32px;padding:0;margin:0;
 border:0;border-radius:9px;background:rgba(255,255,255,.06);color:#cbd5e1;cursor:pointer;
}
.login{
 width:100%;height:46px;margin-top:17px;border:0;border-radius:12px;color:white;
 background:linear-gradient(135deg,#2563eb,#06b6d4);
 font-weight:900;font-size:11px;cursor:pointer;
 box-shadow:0 10px 28px rgba(37,99,235,.22);transition:.2s;
}
.login:hover{transform:translateY(-1px);filter:brightness(1.08)}
.login:disabled{opacity:.55;cursor:not-allowed;transform:none}
.message{
 min-height:18px;text-align:center;margin-top:12px;font-size:9px;font-weight:700;
}
.footer{text-align:center;color:#64748b;font-size:8px;line-height:1.6;margin-top:20px}
.footer b{color:#94a3b8}
</style>
</head>

<body>
<div class="orb one"></div><div class="orb two"></div>

<div class="card">
 <div class="badge">🔐</div>
 <h1>Admin Control Center</h1>
 <div class="subtitle">HARI BATTLE ARENA</div>

 <div class="secure">🛡️ FIREBASE AUTHENTICATION ENABLED</div>

 <label for="email">ADMIN EMAIL</label>
 <input id="email" type="email" autocomplete="username" placeholder="Enter admin email">

 <label for="password">PASSWORD</label>
 <div class="input-wrap">
   <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
   <button class="password-toggle" type="button" onclick="togglePassword()">👁</button>
 </div>

 <button class="login" id="loginBtn" onclick="login()">SIGN IN SECURELY</button>
 <div id="message" class="message"></div>

 <div class="footer">
   Access is allowed only when the signed-in Firebase account has
   <b>role = admin</b> in the <b>admins</b> collection.
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
 getFirestore,
 doc,
 getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBG0LYrIEuV_eYK8rZvweoQASTBF_gfDfA",
 authDomain:"ff-tournament-915ed.firebaseapp.com",
 projectId:"ff-tournament-915ed"
};

const app=initializeApp(firebaseConfig,"adminApp");
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

function setMessage(text,type="error"){
 const el=$("message");
 el.textContent=text;
 el.style.color=type==="ok"?"#4ade80":"#f87171";
}

async function checkAdmin(user){
 if(!user) return false;
 try{
const snap=await getDoc(doc(db,"users",user.uid));
return snap.exists() && snap.data()?.admin === true;
 }catch(error){
   console.error(error);
   return false;
 }
}

/* If an already signed-in account is an admin, skip the login screen. */
onAuthStateChanged(auth,async(user)=>{
 if(!user) return;
 const allowed=await checkAdmin(user);
 if(allowed){
   location.replace("dashboard.html");
 }else{
   await signOut(auth);
 }
});

window.togglePassword=function(){
 const input=$("password");
 input.type=input.type==="password"?"text":"password";
};

window.login=async function(){
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;
 const btn=$("loginBtn");

 if(!email||!password){
   setMessage("Enter admin email and password.");
   return;
 }

 btn.disabled=true;
 btn.textContent="VERIFYING ACCESS…";
 setMessage("Checking Firebase admin authorization...","ok");

 try{
   const result=await signInWithEmailAndPassword(auth,email,password);
   const allowed=await checkAdmin(result.user);

   if(!allowed){
     await signOut(auth);
     setMessage("Access denied. This account is not an admin.");
     return;
   }

   setMessage("Access granted. Opening dashboard...","ok");
   setTimeout(()=>location.replace("dashboard.html"),450);

 }catch(error){
   console.error(error);
   setMessage("Login failed. Check your email and password.");
 }finally{
   btn.disabled=false;
   btn.textContent="SIGN IN SECURELY";
 }
};
</script>
</body>
</html>
